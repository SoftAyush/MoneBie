<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Sora, "Segoe UI", system-ui, sans-serif; }
    a { color: #005AC1; } a:hover { color: #00408C; }
    .note { font-size: 12px; line-height: 1.5; color: #6B7280; }
  </style>
</helmet>

<div style="width: 300px; height: 400px; background: #FEFBFF; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">

  <div style="display: flex; flex-direction: column; gap: 3px;">
    <div style="font-size: 15px; font-weight: 700; color: #16181C;">Alt · Apex</div>
    <div class="note">Two chevrons, no counter. Growth stacked on a base.</div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 14px; padding: 18px; display: flex; justify-content: center;">
    <svg viewBox="0 0 108 108" width="104" height="104" role="img" aria-label="Apex mark">
      <path fill="#005AC1" d="M54 26 L80 62 L67 62 L54 44 L41 62 L28 62 Z"/>
      <path fill="#F0B429" d="M54 54 L80 90 L67 90 L54 72 L41 90 L28 90 Z" opacity="0.9"/>
    </svg>
  </div>

  <div style="background: #16181C; border-radius: 14px; padding: 18px; display: flex; align-items: center; justify-content: center; gap: 12px;">
    <svg viewBox="0 0 108 108" width="42" height="42" role="img" aria-label="Apex on dark">
      <path fill="#AFC6FF" d="M54 26 L80 62 L67 62 L54 44 L41 62 L28 62 Z"/>
      <path fill="#F0B429" d="M54 54 L80 90 L67 90 L54 72 L41 90 L28 90 Z" opacity="0.9"/>
    </svg>
    <div style="font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: #F5F5F7;">Aurex</div>
  </div>

  <div style="display: flex; gap: 12px; align-items: center;">
    <div style="width: 62px; height: 62px; border-radius: 50%; overflow: hidden;">
      <svg viewBox="0 0 108 108" width="62" height="62" role="img" aria-label="Apex icon">
        <rect width="108" height="108" fill="#005AC1"/>
        <g transform="translate(54,54) scale(0.72) translate(-54,-54)">
          <path fill="#FFFFFF" d="M54 26 L80 62 L67 62 L54 44 L41 62 L28 62 Z"/>
          <path fill="#F0B429" d="M54 54 L80 90 L67 90 L54 72 L41 90 L28 90 Z"/>
        </g>
      </svg>
    </div>
    <div class="note" style="flex-grow: 1;">Sharpest at small sizes. But it reads as a generic fintech arrow and says nothing about two sides.</div>
  </div>

</div>
</x-dc>
</body>
</html>
